name: compiler-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compiler-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-tests:
    name: Compiler tests (self-hosted, GCP)
    runs-on: [self-hosted, gcp-ephemeral, n2-highmem-16, "run-${{ github.run_id }}"]
    timeout-minutes: 60          # OpenFHE cold build ~15 min + full record/replay round trip
    env:
      SDK: /mnt/niobium-sdk/sdk  # mounted read-only at boot
      PORT: "9443"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin branch SDK (lockstep changes only — .sdk-pin)
        # No-op without a .sdk-pin file at the consumer repo's root (path via
        # SDK_PIN_FILE when the workflow nests that checkout). With one, the named
        # sdk-branch-* release's tarball is fetched from the GCS mirror,
        # checksum-verified against its .sha256 sidecar, and BIND-MOUNTED over
        # the nightly SDK, so every later step -- including anything that
        # hardcodes the mount path -- sees the pin. A GITHUB_ENV write would
        # not do that: this job defines SDK as job-level env, which GITHUB_ENV
        # does not reliably override. The pin proves itself by mount identity
        # (the SDK path now IS the extracted tree) plus the SDK contract file;
        # the bundle's own VERSION is logged, not asserted -- the compiler
        # writes the version string there, not the tag. Hard-fails on main so
        # a pin cannot be merged.
        run: |
          set -e
          # SDK_PIN_FILE: where THIS workflow checked the consumer repo out. Default is
          # the workspace root; a workflow that nests the repo (fbs-consumer-check puts
          # niobium-client at fbs/submission/niobium-client) sets it in job env.
          PIN="${SDK_PIN_FILE:-.sdk-pin}"
          [ -f "$PIN" ] || { echo "no $PIN — nightly SDK"; exit 0; }
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::.sdk-pin must not exist on main — remove it in the merge"; exit 1
          fi
          TAG="$(tr -d ' \r\n' < "$PIN")"
          case "$TAG" in sdk-branch-*) ;; *) echo "::error::.sdk-pin must name an sdk-branch-* tag"; exit 1;; esac
          DEST="$RUNNER_TEMP/branch-sdk"; mkdir -p "$DEST"
          SRC="gs://github-runner-499901-sdk-branches/$TAG"
          # The compiler build takes 15-25 min on the happy path (up to 3 h if
          # it queues behind a running nightly) and its tarball lands in the
          # bucket as it finishes; a PR opened right after the dispatch waits
          # here instead of failing and asking for a rerun.
          for i in $(seq 1 60); do
            gcloud storage ls "$SRC/*.tar.*" >/dev/null 2>&1 && break
            [ "$i" -eq 1 ] && echo "$TAG not in the mirror yet -- waiting up to 30 min for the compiler build"
            sleep 30
          done
          gcloud storage cp "$SRC/*.tar.*" "$DEST/" --quiet \
            || { echo "::error::$TAG still not in the mirror after 30 min -- check the release-binary-sdk run on the compiler branch, and that the tag is exactly right"; exit 1; }
          # Two objects arrive: the tarball and its .sha256 sidecar. Name the
          # tarball explicitly (a bare *.tar.* glob would hand tar the sidecar
          # as a member to extract) and verify against the sidecar while it is here.
          TARBALL="$(find "$DEST" -maxdepth 1 -name '*.tar.*' ! -name '*.sha256' | head -1)"
          [ -n "$TARBALL" ] || { echo "::error::no tarball in $DEST"; exit 1; }
          ( cd "$DEST" && sha256sum -c ./*.sha256 ) || { echo "::error::checksum mismatch for $TAG"; exit 1; }
          tar -xf "$TARBALL" -C "$DEST"
          SDKDIR="$(dirname "$(find "$DEST" -maxdepth 2 -name bin -type d | head -1)")"
          [ -x "$SDKDIR/bin/nbcc_fhetch_replay" ] \
            || { echo "::error::$TAG has no bin/nbcc_fhetch_replay -- not an SDK bundle this job can use"; exit 1; }
          sudo mount --bind "$SDKDIR" "$SDK"
          [ "$(stat -c %d:%i "$SDK")" = "$(stat -c %d:%i "$SDKDIR")" ] \
            || { echo "::error::pin did not take: $SDK is not $SDKDIR after the bind mount"; exit 1; }
          # Bundle-to-tag binding, warning-level: the producers enforce it, but a
          # bundle whose VERSION does not even mention the tag's sha7 is worth a
          # word in the log. The selftest fixture carries the real sha7, so it does
          # not warn; only a bundle mirrored under an unrelated tag would.
          BUNDLE_VERSION="$(cat "$SDK/VERSION" 2>/dev/null || echo n/a)"
          grep -q "${TAG##*-}" <<< "$BUNDLE_VERSION" \
            || echo "::warning::bundle VERSION '$BUNDLE_VERSION' does not mention the tag's sha7 (${TAG##*-})"
          echo "pinned branch SDK: $TAG over $SDK (bundle VERSION: $BUNDLE_VERSION)"
      - name: Verify SDK is mounted
        run: |
          test -x "$SDK/bin/nbcc_fhetch_replay" || { echo "::error::SDK not mounted at $SDK"; exit 1; }

      - name: Install build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-numpy
          python3 -c "import numpy" || { echo "::error::numpy not importable"; exit 1; }

      - name: Build niobium-client + encrypted-nid stages (release)
        # build_task.sh is self-contained: it inits the root niobium-client submodule,
        # builds its OpenFHE + FHETCH transport, then the NID stages into ./build.
        run: |
          scripts/build_task.sh
          test -x build/server_standalone_sdk || { echo "::error::stages did not build"; exit 1; }

      - name: Map the SDK into the layout the transport server expects
        run: |
          # The server daemon --execs $NIOBIUM_COMPILER_ROOT/build/nbcc_fhetch_replay.
          # The SDK ships bin/ + lib/; bridge with a shim of symlinks.
          SHIM="$RUNNER_TEMP/nbcc-root"
          mkdir -p "$SHIM/build"
          ln -sf "$SDK"/bin/* "$SHIM/build/"
          ln -sf "$SDK"/lib/* "$SHIM/build/"
          test -x "$SHIM/build/nbcc_fhetch_replay" || { echo "::error::SDK missing nbcc_fhetch_replay"; exit 1; }
          echo "NIOBIUM_COMPILER_ROOT=$SHIM" >> "$GITHUB_ENV"
          # The compiler needs the SDK device specs for a non-local target.
          echo "NIOBIUM_SPEC_DIR=$SDK/share/niobium/devices" >> "$GITHUB_ENV"

      - name: Start the transport server (background)
        run: |
          set +x
          CLIENT_ROOT="$GITHUB_WORKSPACE/niobium-client"
          SERVER_BIN="$CLIENT_ROOT/build/src/fhetch_transport/nbcc_fhetch_replay_server"
          COMPILER_BIN="$NIOBIUM_COMPILER_ROOT/build/nbcc_fhetch_replay"
          test -x "$SERVER_BIN" || { echo "::error::server binary not built: $SERVER_BIN"; exit 1; }

          ENV_FILE="$CLIENT_ROOT/build/niobium_client.env"
          [ -f "$ENV_FILE" ] && . "$ENV_FILE"
          : "${OPENFHE_LIB:=$CLIENT_ROOT/vendor/lib/openfhe/lib}"

          # The server needs the client's OpenFHE; its replay child needs the
          # compiler's. An inherited path overrides the child's rpath and both
          # install under the same SONAME, so give the child its own path.
          EXEC_WRAPPER="$RUNNER_TEMP/nbcc_fhetch_replay_exec_wrapper.sh"
          cat > "$EXEC_WRAPPER" <<WRAPPER
          #!/bin/bash
          # Generated by compiler-tests.yml — do not edit.
          export LD_LIBRARY_PATH="$NIOBIUM_COMPILER_ROOT/build"
          exec "$COMPILER_BIN" "\$@"
          WRAPPER
          chmod +x "$EXEC_WRAPPER"

          # PATH must include the compiler build dir: the compiler's secondary
          # replay step execs a `replay` helper by bare name (shipped at SDK bin/replay,
          # symlinked into the shim build/). It passes through the wrapper.
          LD_LIBRARY_PATH="$OPENFHE_LIB:$NIOBIUM_COMPILER_ROOT/build" \
            PATH="$NIOBIUM_COMPILER_ROOT/build:$PATH" \
            "$SERVER_BIN" --port "$PORT" --bind 127.0.0.1 --exec "$EXEC_WRAPPER" \
            >"$RUNNER_TEMP/fhetch_server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fhetch_server.pid"

          # Poll /healthz with a short sleep (no busy-wait).
          ready=0
          for i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then ready=1; break; fi
            kill -0 "$(cat "$RUNNER_TEMP/fhetch_server.pid")" 2>/dev/null || { echo "::error::server exited before healthz"; exit 1; }
            sleep 0.2
          done
          [ "$ready" = "1" ] || { echo "::error::server did not become healthy"; exit 1; }

      - name: Run submission — full profile, record + replay over transport (FHE_SIM)
        run: |
          set +x
          export NBCC_FHETCH_SERVER="http://127.0.0.1:$PORT"
          rc=0
          # Compiler output captured to a file, kept out of the public log.
          python3 harness/run_submission.py --profile full --target FHE_SIM --opt-level O3 \
            >"$RUNNER_TEMP/nid-replay.log" 2>&1 || rc=1
          if [ $rc -eq 0 ]; then
            echo "encrypted-nid E2E (full/FHE_SIM): PASS"
          else
            echo "::error::encrypted-nid E2E FAILED (output suppressed; see private debug logs)"
          fi
          exit $rc

      - name: Stop the transport server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fhetch_server.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/fhetch_server.pid")"
            kill -TERM "$pid" 2>/dev/null || true
            for i in 1 2 3 4 5; do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -0 "$pid" 2>/dev/null && kill -KILL "$pid" 2>/dev/null || true
          fi

      - name: Upload suppressed logs to private bucket (on failure)
        if: failure()
        run: |
          set +x
          BUCKET="your-ci-debug-bucket"    # private, write-only for the runner SA
          PREFIX="${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}"
          TOKEN="$(curl -sf -H 'Metadata-Flavor: Google' \
            'http://metadata/computeMetadata/v1/instance/service-accounts/default/token' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')"
          for f in nid-replay.log fhetch_server.log; do
            [ -f "$RUNNER_TEMP/$f" ] || continue
            obj="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$PREFIX/$f")"
            curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: text/plain' \
              --data-binary @"$RUNNER_TEMP/$f" \
              "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$obj" \
              >/dev/null && echo "uploaded $f" || echo "upload failed: $f"
          done
